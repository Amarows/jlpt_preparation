call: tests.golden_hardening:startup
expect:
  default:
    starts: true
    bind: 127.0.0.1
  local_lan:
    starts: true
    bind: 0.0.0.0
  tailscale:
    starts: true
    bind: 127.0.0.1
  tailscale_lan:
    starts: false
    message: 'JLPT_AUTH=tailscale trusts Tailscale-User-Login only behind tailscale serve: JLPT_BIND must
      be 127.0.0.1, not ''0.0.0.0'''
  tailscale_localhost_name:
    starts: false
    message: 'JLPT_AUTH=tailscale trusts Tailscale-User-Login only behind tailscale serve: JLPT_BIND must
      be 127.0.0.1, not ''localhost'''
  cloudflare_access_gone:
    starts: false
    message: JLPT_AUTH must be one of local, tailscale, not 'access'
  unknown_mode:
    starts: false
    message: JLPT_AUTH must be one of local, tailscale, not 'open'
