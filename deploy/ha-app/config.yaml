name: JLPT portal
version: "0.2.0"
slug: jlpt_portal
description: Study portal for the learners in learners.json, reached only through Tailscale node sharing.
arch:
  - aarch64
init: false
startup: application
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
map:
