<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLPT N4 Practice</title><link rel="stylesheet" href="/web/style.css"></head><body><header><h1>JLPT N4 Practice</h1><aside id="badge" aria-live="polite"></aside></header><main><section class="panel"><h2>Start a run</h2><div class="controls"><label>Mode<select id="mode"><option value="drill">Drill</option><option value="timed">Timed</option><option value="practice">Practice</option></select></label><label>Section<select id="section"><option value="vocab">Vocabulary</option><option value="grammar">Grammar</option><option value="reading">Reading</option><option value="listening">Listening</option><option value="mixed">Mixed</option><option value="mistakes">My mistakes</option></select></label><label>Length<select id="n"><option>10</option><option>20</option><option>40</option></select></label><div class="start-buttons"><button id="again" class="secondary" hidden>Do again</button><button id="start">Start practice</button></div></div></section><section class="report" id="report" hidden><div class="panel"><h3>P(pass) after each run</h3><div id="progress-chart" class="chart"></div></div><div class="panel"><h3>Accuracy by section <small class="subtle" id="report-days"></small></h3><div id="section-bars" class="bars"></div></div><div class="panel"><h3>Latest mistakes</h3><ol id="mistakes" class="mistakes"></ol></div></section></main><script src="/web/app.js"></script></body></html>
